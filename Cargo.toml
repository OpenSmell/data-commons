[package]
name = "data-commons"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenSmell Data Commons: submission, verification, and approval pipeline"

[dependencies]
opensmell = { path = "../opensmell-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
sha2 = "0.10"
